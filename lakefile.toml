name = "APAP"
keywords = ["math", "combinatorics", "additive-combinatorics", "fourier-analysis"]
defaultTargets = ["APAP"]

[leanOptions]
# Pretty-prints `fun a ↦ b`
pp.unicode.fun = true
# Don't assume a typo is a new variable
autoImplicit = false
relaxedAutoImplicit = false
# Enable all mathlib linters: automatically matches what mathlib uses.
weak.linter.mathlibStandardSet = true
# ... except for the header linter
linter.style.header = false
# Switch off warnings generated by `sorry`
warn.sorry = false

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "AddCombi"
git = "https://github.com/leanprover-community/add-combi.git"
rev = "8ab39477ca274ffc4600eb4eb36c70988d59ccda"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[[lean_lib]]
name = "APAP"
